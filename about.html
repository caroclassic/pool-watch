<script type="module">
import { ABOUT, FEEDBACK_EMAIL, FEEDBACK_SUBJECT, DISCLAIMER } from "./js/copy.js";
import { h, rich } from "./js/ui/dom.js";
import { createStorage } from "./js/storage.js";
import { mountThemeButton } from "./js/theme.js";
import { createFollowsStore } from "./js/storage.js";
import { createHttpSource } from "./js/data.js";
import { dataBase } from "./js/config.js";
import { indexPlayers } from "./js/players-model.js";
import { legendSheet, followingSheet, saveSheet, importSheet } from "./js/ui/sheets.js";
import { setFollowButton } from "./js/ui/icons.js";
const storage = createStorage();
mountThemeButton(document.getElementById("theme-btn"), storage);
// The header's Following and Legend buttons work here too (before 2026-11-27 they did nothing on About).
const follows = createFollowsStore(storage, () => new Date());
const followBtn = document.getElementById("follow-btn");
const showCount = () => setFollowButton(followBtn, document.getElementById("follow-count"), follows.count());
follows.subscribe(showCount); showCount();
document.getElementById("legend-btn").addEventListener("click", (e) => legendSheet({ from: e.currentTarget }));
let players = null;
followBtn.addEventListener("click", async (e) => {
  const from = e.currentTarget;
  if (!players) { try { players = indexPlayers(await createHttpSource({ base: dataBase() }).getPlayers()); } catch { players = new Map(); } }
  const openSave = () => saveSheet({ follows, players, from, baseUrl: location.origin + "/",
    onImport: (ids) => importSheet({ ids, follows, players, onMerge: () => follows.merge(ids), onReplace: () => follows.replace(ids) }) });
  followingSheet({ follows, players, from, onSave: openSave, onUnfollow: (id) => follows.remove(id), nextFor: () => undefined });
});
const main = document.getElementById("main");
for (const b of ABOUT) {
  if (b.h) main.append(h("h2", { class: "about-title" }, b.h));
  else if (b.em) main.append(h("p", { class: "about-em" }, b.em));
  else if (b.p) main.append(h("p", null, rich(b.p)));
  else if (b.mail) main.append(h("p", null, rich(b.mail), " ", h("a", { href: `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(FEEDBACK_SUBJECT)}` }, FEEDBACK_EMAIL), " with the match and what you saw."));
}
main.append(h("p", { class: "small" }, h("a", { href: "./" }, "Back to matches")));
main.append(h("footer", { class: "foot" }, h("p", { class: "small dim" }, DISCLAIMER)));
</script>
