<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><a href="./">Stateside <span class="xi">XI</span></a></h1>
      <div class="top-tools">
        <button type="button" id="follow-btn" class="pill"><span aria-hidden="true">⌖</span> <span id="follow-count">Following</span></button>
        <button type="button" id="theme-btn" class="pill"></button>
        <button type="button" id="legend-btn" class="icon-btn" aria-label="Legend: what the labels mean">ⓘ</button>
      </div>
    </div>
    <p class="scope">Every match. Every USMNT player.</p>
    <p class="scope scope-2">Follow the chase for the shirt. Track who's in the picture.</p>
    <nav class="sitenav" aria-label="Site"><a href="./">Matches</a><a href="players.html">Players</a></nav>
  </header>
  <main id="main" class="about" tabindex="-1"></main>
</div>
<script type="module">
import { ABOUT, FEEDBACK_EMAIL, FEEDBACK_SUBJECT, DISCLAIMER } from "./js/copy.js";
import { h, rich } from "./js/ui/dom.js";
import { createStorage } from "./js/storage.js";
import { mountThemeButton } from "./js/theme.js";
mountThemeButton(document.getElementById("theme-btn"), createStorage());
const main = document.getElementById("main");
for (const b of ABOUT) {
  if (b.h) main.append(h("h2", { class: "about-title" }, b.h));
  else if (b.em) main.append(h("p", { class: "about-em" }, b.em));
  else if (b.p) main.append(h("p", null, rich(b.p)));
  else if (b.mail) main.append(h("p", null, rich(b.mail), " ", h("a", { href: `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(FEEDBACK_SUBJECT)}` }, FEEDBACK_EMAIL), " with the match and what you saw."));
}
main.append(h("p", { class: "small" }, h("a", { href: "./" }, "Back to matches")));
main.append(h("footer", { class: "foot" }, h("p", { class: "small dim" }, DISCLAIMER)));
</script>
