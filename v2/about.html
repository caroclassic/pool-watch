<script type="module">
import { ABOUT } from "./js/copy.js";
import { h, rich } from "./js/ui/dom.js";
const main = document.getElementById("main");
for (const b of ABOUT) {
  if (b.h) main.append(h("h2", { class: "about-title" }, b.h));
  else if (b.em) main.append(h("p", { class: "about-em" }, b.em));
  else if (b.p) main.append(h("p", null, rich(b.p)));
}
main.append(h("p", { class: "small" }, h("a", { href: "./" }, "Back to matches")));
</script>
